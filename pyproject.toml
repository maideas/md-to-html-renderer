[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-to-html-renderer"
version = "3.0.0"
description = "Extensible Markdown to HTML renderer with pluggable palettes and syntax highlighting"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "markdown-it-py>=4.1",
    "mdit-py-plugins>=0.6",
    "Pygments>=2.17",
    "nh3>=0.2",
]

[project.optional-dependencies]
linkify = ["linkify-it-py>=2.0"]
emoji = ["emoji>=2.0"]
all = ["linkify-it-py>=2.0", "emoji>=2.0"]

[project.scripts]
md-to-html-renderer = "md_to_html_renderer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md_to_html_renderer = ["static/*.css", "static/palettes/*.css", "static/palettes/*.json"]
