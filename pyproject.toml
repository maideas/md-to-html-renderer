[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-markdown"
version = "1.0.0"
description = "Render GitHub-Flavoured Markdown to HTML that looks exactly like GitHub"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "markdown-it-py>=4.1",
    "mdit-py-plugins>=0.6",
    "Pygments>=2.17",
    "nh3>=0.2",
]

[project.optional-dependencies]
linkify = ["linkify-it-py>=2.0"]
emoji = ["emoji>=2.0"]
all = ["linkify-it-py>=2.0", "emoji>=2.0"]

[project.scripts]
github-markdown = "github_markdown.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
github_markdown = ["static/*.css"]
